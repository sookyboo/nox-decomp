services:
  seed-gamefiles:
    image: ghcr.io/nox-decomp/nox-decomp-server:latest
    pull_policy: always
    user: "10001:10001"
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Read-only source on the host (K8s hostPath)
      - type: bind
        source: /opt/nox/gamefiles/app
        target: /src
        read_only: true

      # Writable runtime copy (K8s emptyDir -> here: named volume)
      - type: volume
        source: nox-gamefiles
        target: /dst

    # Mark the seeding as "healthy" once done, so the main service can wait for it
    healthcheck:
      test: ["CMD-SHELL", "test -f /dst/.seeded || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 24
      start_period: 1s

    command: >
      set -eu;
      CHECK="/dst/.seeded";
      if [ -f "${CHECK}" ]; then
        echo "Gamefiles already seeded (${CHECK} exists); skipping copy.";
        exit 0;
      fi;
      echo "Seeding gamefiles from /src -> /dst ...";
      mkdir -p /dst;
      cp -R --no-preserve=ownership,mode,timestamps /src/. /dst/;
      date > "${CHECK}";
      echo "Seed complete.";

  nox-decomp:
    image: ghcr.io/nox-decomp/nox-decomp-server:latest
    pull_policy: always
    user: "10001:10001"
    depends_on:
      seed-gamefiles:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

    env_file:
      - .env
    environment:
      NOX_CONTROL_SERVER: "1"
      NOX_CONTROL_SERVER_BIND: "127.0.0.1"
      NOX_CONTROL_SERVER_PORT: "2323"

      NOX_SKIP_INTRO_MOVIES: "1"
      NOX_CONTROL_SERVER_SLEEP_SCALE: "6"
      NOX_CONTROL_SERVER_BOOT: "sleep 5000; macro server;"
      NOX_CONTROL_INJECT_LOG: "0"
      NOX_CONTROL_LOG: "1"

      NOX_SERVER_NAME: "NoxDecomp"
      NOX_SERVER_LESSONS: "15"
      NOX_SERVER_TIME: "0"
      NOX_SERVER_DEFAULT_MAP: "capflag"

      NOX_CAPTURE_INPUT: "0"

      NOX_LOBBY_REGISTER_ENABLE: "0" # Enable this once port forwarding is set up on your router
      NOX_UPNP_ENABLE: "0"
      NOX_GAMEPAD: "0"

    ports:
      # Match the K8s NodePorts
      - "31890:18590/udp"
      - "32323:2323/tcp"

    volumes:
      - type: volume
        source: nox-gamefiles
        target: /opt/nox-decomp/gamefiles/app

    # Rough equivalent to K8s limits
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 200M

volumes:
  nox-gamefiles: {}

# Make a .env file
# NOX_CONTROL_SERVER_PASSWORD=secret
# NOX_SERVER_SYSOP=secret