; nox-decomp.ini
; Launcher configuration + UI schema for env vars.
; Unknown sections/keys are preserved on Save.

[launcher]
; If 1 and gamefiles/app/gamedata.bin exists, the launcher may skip extraction UI paths.
; (In the current C file, UI still shows, but this flag is reserved.)
hide_when_ready = 0

; UI log textbox ring buffer size (bytes). File log is unlimited.
ring_buffer_bytes = 1048576

; Dialog conversion: convert all Dialog\*.wav only if marker is missing.
convert_dialog = 1
convert_marker = gamefiles\app\converted_dialog.txt
dialog_dir     = gamefiles\app\Dialog

; Asset and template locations
assets_dir   = gamefiles\app
template_cfg = nox.cfg
log_file     = log.txt

; Values written into nox.cfg
fullscreen = 1
bits       = 16


[ui.env]
; Format:
; ENV_NAME = type=<bool|int|float|string> ; label=... ; default=... ; help=...
; Optional: min/max/step for numeric, maxlen/secret for string, true_value/false_value for bool, order, visible.

NOX_GAMEPAD                 = type=bool  ; default=1   ; label="Enable gamepad"              ; help="0 disables gamepad support" ; order=10
NOX_GAMEPAD_EXIT            = type=bool  ; default=1   ; label="Allow gamepad exit"          ; help="If enabled, gamepad can exit the game" ; order=20
NOX_GAMEPAD_INI             = type=string; default="nox.gptk2.ini" ; label="Gamepad INI file" ; help="Path to controller mapping INI (relative to launcher dir)" ; maxlen=260 ; order=30

NOX_MOUSE_SENSITIVITY       = type=float ; default=1.0 ; min=0.1 ; max=10.0 ; step=0.1 ; label="Mouse sensitivity" ; help="1.0 is default. Higher is faster." ; order=40

;NOX_SKIP_INTRO_MOVIES       = type=bool  ; default=0   ; label="Skip intro movies"           ; help="If enabled, skip startup videos" ; order=50

NOX_LOBBY_REGISTER_ENABLE   = type=bool  ; default=0   ; label="Register to lobby"           ; help="If enabled, host games can register with lobby server" ; order=60
NOX_UPNP_ENABLE             = type=bool  ; default=0   ; label="Enable UPnP port mapping"    ; help="If enabled, tries UPnP for UDP 18590" ; order=70

NOX_LIMIT_RANGE_ON_RUN      = type=bool  ; default=0   ; label="Limit range on run"          ; help="Restricts run distance if enabled" ; order=80
NOX_LIMIT_RANGE_ON_RUN_RADIUS = type=int ; default=118 ; min=0 ; max=10000 ; step=1 ; label="Run limit radius" ; help="Radius used when run limiting is enabled" ; order=90

NOX_LINEAR_SCALING                 = type=bool  ; default=1   ; label="Enable smooth scaling"              ; help="0 disables smooth linear scaling" 

NOX_INTEGER_SCALING                 = type=bool  ; default=0   ; label="Force integer scaling"              ; help="0 disables exact integer scaling" 

; Control server settings (if your build supports them)
;NOX_CONTROL_SERVER          = type=bool  ; default=0   ; label="Enable control server"       ; help="Enables control server if supported" ; order=100
;NOX_CONTROL_SERVER_BIND     = type=string; default="127.0.0.1" ; label="Control server bind" ; help="Bind address" ; maxlen=64 ; order=110
;NOX_CONTROL_SERVER_PORT     = type=int   ; default=2323 ; min=1 ; max=65535 ; step=1 ; label="Control server port" ; help="TCP port" ; order=120
;NOX_CONTROL_SERVER_PASSWORD = type=string; default="secret" ; label="Control server password" ; help="Password (stored in ini)" ; maxlen=128 ; secret=1 ; order=130

; Input capture / diagnostics
;NOX_CAPTURE_INPUT           = type=bool  ; default=0   ; label="Capture input"               ; help="Enable input capture (if supported)" ; order=200

;NOX_NET_LOG                 = type=bool  ; default=0   ; label="Network log"                ; help="Enable network logging" ; order=210
;NOX_WSA_LOG                 = type=bool  ; default=0   ; label="WSA log"                    ; help="Enable WSA logging" ; order=220
;NOX_PACKET_LOG              = type=bool  ; default=0   ; label="Packet log"                 ; help="Enable packet logging" ; order=230


[env]
; User-editable values (launcher writes here).
; If a key is missing here, the schema default is used.
; You can add extra env vars here even if not in [ui.env]; they will still be applied at runtime.

NOX_GAMEPAD=1
NOX_GAMEPAD_EXIT=1
NOX_GAMEPAD_INI=nox.gptk2.ini

NOX_MOUSE_SENSITIVITY=1

NOX_SKIP_INTRO_MOVIES=0
NOX_LOBBY_REGISTER_ENABLE=0
NOX_UPNP_ENABLE=0

NOX_LIMIT_RANGE_ON_RUN=0
NOX_LIMIT_RANGE_ON_RUN_RADIUS=118

NOX_CONTROL_SERVER=0
NOX_CONTROL_SERVER_BIND=127.0.0.1
NOX_CONTROL_SERVER_PORT=2323
NOX_CONTROL_SERVER_PASSWORD=secret

NOX_CAPTURE_INPUT=0
NOX_NET_LOG=0
NOX_WSA_LOG=0
NOX_PACKET_LOG=0


NOX_LINEAR_SCALING=1
NOX_INTEGER_SCALING=0
[notes]
; This section is intentionally "unknown" to the launcher.
; It should be preserved across Save operations.
; Put human notes here.
