name: Build nox-decomp artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-arm:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set release suffix
        run: |
          set -euxo pipefail
          RAW_NAME="${GITHUB_REF_NAME}"
          SAFE_NAME="$(printf '%s' "$RAW_NAME" | sed 's#[^A-Za-z0-9._-]#-#g')"
          echo "RELEASE_SUFFIX=${SAFE_NAME}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Show initial disk usage
        run: |
          df -h
          docker system df || true

      - name: Clean up old containers
        run: |
          docker rm -f noxdecomp_tmp || true
          docker rm -f noxdecomp_tmp-x86libs || true

      - name: Build ARM image and extract artifacts
        run: |
          set -euxo pipefail

          mkdir -p artifacts/noxd.armhf
          mkdir -p artifacts/gl4es.armhf
          mkdir -p artifacts/ffmpeg.armhf

          docker buildx build \
            --load \
            --platform=linux/arm64 \
            --progress=plain \
            --cache-from type=gha,scope=noxdecomp-arm \
            --cache-to type=gha,scope=noxdecomp-arm,mode=max \
            -f Dockerfile \
            -t noxdecomp-build .

          docker create --name noxdecomp_tmp noxdecomp-build
          docker cp noxdecomp_tmp:/build/nox-decomp/build/src/out artifacts/noxd.armhf
          docker cp noxdecomp_tmp:/build/gl4es/lib/libGL.so.1 artifacts/gl4es.armhf/libGL.so.1
          docker cp noxdecomp_tmp:/opt/ffmpeg-armhf/lib/. artifacts/ffmpeg.armhf/
          docker rm -f noxdecomp_tmp

      - name: Upload ARM build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: noxd-armhf
          path: |
            artifacts/noxd.armhf
            artifacts/gl4es.armhf
            artifacts/ffmpeg.armhf

      - name: Cleanup temporary build state
        if: always()
        run: |
          docker rm -f noxdecomp_tmp || true
          docker image prune -af || true
          docker builder prune -af || true

  build:
    runs-on: ubuntu-latest
    needs: build-arm

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set release suffix
        run: |
          set -euxo pipefail
          RAW_NAME="${GITHUB_REF_NAME}"
          SAFE_NAME="$(printf '%s' "$RAW_NAME" | sed 's#[^A-Za-z0-9._-]#-#g')"
          echo "RELEASE_SUFFIX=${SAFE_NAME}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            ostree

      - name: Add Flathub remote
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Show initial disk usage
        run: |
          df -h
          docker system df || true

      - name: Clean up old containers
        run: |
          docker rm -f noxdecomp_tmp-x86 || true
          docker rm -f noxdecomp_tmp-winx86 || true

      - name: Download ARM build artifacts
        uses: actions/download-artifact@v8
        with:
          name: noxd-armhf
          path: artifacts

      - name: Build x86 Linux image and extract artifacts
        run: |
          set -euxo pipefail

          mkdir -p artifacts/noxd.i386
          mkdir -p artifacts/ffmpeg.i386

          docker buildx build \
            --load \
            --platform=linux/amd64 \
            --progress=plain \
            --cache-from type=gha,scope=noxdecomp-x86 \
            --cache-to type=gha,scope=noxdecomp-x86,mode=max \
            -f Dockerfile.x86 \
            -t noxdecomp-build-x86 .

          docker create --name noxdecomp_tmp-x86 noxdecomp-build-x86
          docker cp noxdecomp_tmp-x86:/build/nox-decomp/build/src/out artifacts/noxd.i386
          docker cp noxdecomp_tmp-x86:/opt/ffmpeg-i386/lib/. artifacts/ffmpeg.i386/
          docker rm -f noxdecomp_tmp-x86

      - name: Build x86 SDL2 library and extract artifact
        run: |
          set -euxo pipefail

          mkdir -p artifacts/noxd.i386.libs

          docker buildx build \
            --load \
            --platform=linux/amd64 \
            --progress=plain \
            --cache-from type=gha,scope=noxdecomp-x86libs \
            --cache-to type=gha,scope=noxdecomp-x86libs,mode=max \
            -f Dockerfile.x86libs \
            -t noxdecomp-build-x86libs .

          docker create --name noxdecomp_tmp-x86libs noxdecomp-build-x86libs
          docker cp noxdecomp_tmp-x86libs:/usr/i686-linux-gnu/lib/libSDL2-2.0.so.0.2600.2 \
            artifacts/noxd.i386.libs/libSDL2-2.0.so.0
          docker rm -f noxdecomp_tmp-x86libs

      - name: Build Win32 image and extract artifacts
        run: |
          set -euxo pipefail

          rm -rf artifacts/noxd.win32

          docker buildx build \
            --load \
            --platform=linux/amd64 \
            --progress=plain \
            --cache-from type=gha,scope=noxdecomp-winx86 \
            --cache-to type=gha,scope=noxdecomp-winx86,mode=max \
            -f Dockerfile.winx86 \
            -t noxdecomp-build-winx86 .

          docker create --name noxdecomp_tmp-winx86 noxdecomp-build-winx86
          docker cp noxdecomp_tmp-winx86:/build/nox-decomp/build/src/noxd.win32 artifacts/noxd.win32

          if [ -f artifacts/noxd.win32/out.exe ]; then
            mv -f artifacts/noxd.win32/out.exe artifacts/noxd.win32/noxd.winx86.exe
          fi

          docker rm -f noxdecomp_tmp-winx86

      - name: Build innoextract artifacts
        working-directory: dist-scripts/innoextract
        run: |
          set -euxo pipefail

          rm -rf out
          mkdir -p out/linux-x86_64 out/linux-aarch64 out/windows-x86_64

          docker buildx build \
            --target artifacts \
            --cache-from type=gha,scope=noxdecomp-innoextract \
            --cache-to type=gha,scope=noxdecomp-innoextract,mode=max \
            -f Dockerfile \
            -o type=local,dest=./out \
            .

      - name: Show disk usage after Docker builds
        run: |
          df -h
          docker system df || true

      - name: Build Flatpak bundle
        working-directory: dist-scripts/flathub
        run: |
          set -euxo pipefail
          chmod +x deps.sh build.sh
          sed -i 's/^flatpak install /sudo flatpak install /' deps.sh
          ./deps.sh
          ./build.sh

      - name: Show disk usage after Flatpak build
        run: |
          df -h
          docker system df || true

      - name: Assemble Win32 package
        run: |
          set -euxo pipefail

          PKG_DIR="artifacts/noxd.win32.package"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR"
          mkdir -p "$PKG_DIR/gamefiles"
          mkdir -p "$PKG_DIR/licenses"
          mkdir -p "$PKG_DIR/licenses/innoextract"
          mkdir -p "$PKG_DIR/utils"

          # Main Win32 build output, including launch-nox-decomp.exe
          cp -a artifacts/noxd.win32/. "$PKG_DIR/"

          # Rename main exe if needed
          if [ -f "$PKG_DIR/noxd.winx86.exe" ]; then
            mv -f "$PKG_DIR/noxd.winx86.exe" "$PKG_DIR/noxd.i386.exe"
          elif [ -f "$PKG_DIR/out.exe" ]; then
            mv -f "$PKG_DIR/out.exe" "$PKG_DIR/noxd.i386.exe"
          fi

          # Config
          cp dist-scripts/nox.cfg.hires "$PKG_DIR/nox.cfg"
          cp dist-scripts/nox.gptk2.ini "$PKG_DIR/nox.gptk2.ini"

          # Launcher config
          cp dist-scripts/winlaunch/launch-nox-decomp.ini "$PKG_DIR/launch-nox-decomp.ini"

          # Licenses
          cp dist-scripts/licenses/ffmpeg_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/gl4es_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/innoextract_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/libopenal_LICENCE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/nox_decomp_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/sdl_LICENSE.txt "$PKG_DIR/licenses/"

          # Optional extra innoextract license files if present in repo
          if [ -d dist-scripts/licenses/innoextract ]; then
            cp -a dist-scripts/licenses/innoextract/. "$PKG_DIR/licenses/innoextract/"
          fi

          # Innoextract binary from prior build
          if [ -f dist-scripts/innoextract/out/windows-x86_64/innoextract-win64.exe ]; then
            cp dist-scripts/innoextract/out/windows-x86_64/innoextract-win64.exe \
              "$PKG_DIR/utils/innoextract.x86_64.exe"
          else
            find dist-scripts/innoextract/out/windows-x86_64 -maxdepth 1 -type f | head -n 1 | while read -r f; do
              cp "$f" "$PKG_DIR/utils/innoextract.x86_64.exe"
            done
          fi

      - name: Create Win32 release zip
        run: |
          set -euxo pipefail
          cd artifacts/noxd.win32.package
          zip -r ../noxd.win32.x86-${RELEASE_SUFFIX}.zip .

      - name: Upload Win32 release zip
        uses: actions/upload-artifact@v7
        with:
          name: noxd-win32-zip
          path: artifacts/noxd.win32.x86-${{ env.RELEASE_SUFFIX }}.zip
          archive: false

      - name: Assemble Linux i386 package
        run: |
          set -euxo pipefail

          PKG_DIR="artifacts/noxd.i386.package"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR"
          mkdir -p "$PKG_DIR/gamefiles"
          mkdir -p "$PKG_DIR/licenses"
          mkdir -p "$PKG_DIR/licenses/innoextract"
          mkdir -p "$PKG_DIR/utils"
          mkdir -p "$PKG_DIR/ffmpeg.i386"
          mkdir -p "$PKG_DIR/steam"
          mkdir -p "$PKG_DIR/steam/libs.i386.x11"

          # Main Linux i386 build output
          cp -a artifacts/noxd.i386/. "$PKG_DIR/"

          # Normalize main binary name if needed
          if [ -f "$PKG_DIR/out" ]; then
            mv -f "$PKG_DIR/out" "$PKG_DIR/noxd.i386"
          fi

          # Configs
          cp dist-scripts/nox.cfg.hires "$PKG_DIR/nox.cfg"
          cp dist-scripts/nox.gptk2.ini "$PKG_DIR/nox.gptk2.ini"

          # Starter script
          cp dist-scripts/startgen.sh "$PKG_DIR/Nox-Decomp.sh"
          chmod +x "$PKG_DIR/Nox-Decomp.sh"

          # Steam assets
          cp dist-scripts/steamv.png "$PKG_DIR/steam/steamv.png"
          cp dist-scripts/steamh.png "$PKG_DIR/steam/steamh.png"
          cp dist-scripts/io.github.sookyboo.nox-decomp.png \
            "$PKG_DIR/steam/io.github.sookyboo.nox-decomp.png"

          # Optional steam extras if present
          if [ -f dist-scripts/gamecontrollerdb.txt ]; then
            cp dist-scripts/gamecontrollerdb.txt "$PKG_DIR/steam/gamecontrollerdb.txt"
          fi

          # SDL for steam libs bundle
          if [ -f artifacts/noxd.i386.libs/libSDL2-2.0.so.0 ]; then
            cp artifacts/noxd.i386.libs/libSDL2-2.0.so.0 \
              "$PKG_DIR/steam/libs.i386.x11/libSDL2-2.0.so.0"
          elif [ -f "$PKG_DIR/libSDL2-2.0.so.0" ]; then
            cp "$PKG_DIR/libSDL2-2.0.so.0" \
              "$PKG_DIR/steam/libs.i386.x11/libSDL2-2.0.so.0"
          elif [ -f artifacts/noxd.i386/libSDL2-2.0.so.0 ]; then
            cp artifacts/noxd.i386/libSDL2-2.0.so.0 \
              "$PKG_DIR/steam/libs.i386.x11/libSDL2-2.0.so.0"
          fi

          # FFmpeg shared libs
          cp -a artifacts/ffmpeg.i386/. "$PKG_DIR/ffmpeg.i386/"
          
          # Remove pkgconfig and normalize ffmpeg .so names
          rm -rf "$PKG_DIR/ffmpeg.i386/pkgconfig"

          find "$PKG_DIR/ffmpeg.i386" -maxdepth 1 -type l -delete

          for f in "$PKG_DIR"/ffmpeg.i386/*.so.*; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            short="$(printf '%s\n' "$base" | sed -E 's/^(.+\.so\.[0-9]+).*/\1/')"
            if [ "$base" != "$short" ]; then
              mv -f "$f" "$PKG_DIR/ffmpeg.i386/$short"
            fi
          done

          # Licenses
          cp dist-scripts/licenses/ffmpeg_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/gl4es_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/innoextract_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/libopenal_LICENCE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/nox_decomp_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/sdl_LICENSE.txt "$PKG_DIR/licenses/"

          # Optional extra innoextract license files if present in repo
          if [ -d dist-scripts/licenses/innoextract ]; then
            cp -a dist-scripts/licenses/innoextract/. "$PKG_DIR/licenses/innoextract/"
          fi

          # Innoextract binary
          if [ -f dist-scripts/innoextract/out/linux-x86_64/innoextract-linux-x86_64 ]; then
            cp dist-scripts/innoextract/out/linux-x86_64/innoextract-linux-x86_64 \
              "$PKG_DIR/utils/innoextract.x86_64"
            chmod +x "$PKG_DIR/utils/innoextract.x86_64"
          else
            find dist-scripts/innoextract/out/linux-x86_64 -maxdepth 1 -type f | head -n 1 | while read -r f; do
              cp "$f" "$PKG_DIR/utils/innoextract.x86_64"
              chmod +x "$PKG_DIR/utils/innoextract.x86_64"
            done
          fi

          # Keep empty gamefiles dir in tar
          touch "$PKG_DIR/gamefiles/.gitkeep"

      - name: Create Linux i386 release tarball
        run: |
          set -euxo pipefail
          tar -C artifacts/noxd.i386.package -czf artifacts/nox-decomp-linux-i386-${RELEASE_SUFFIX}.tar.gz .

      - name: Upload Linux i386 release tarball
        uses: actions/upload-artifact@v7
        with:
          name: noxd-linux-i386-tarball
          path: artifacts/nox-decomp-linux-i386-${{ env.RELEASE_SUFFIX }}.tar.gz
          archive: false

      - name: Assemble Linux ARMHF package
        run: |
          set -euxo pipefail

          PKG_DIR="artifacts/noxd.armhf.package"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR"
          mkdir -p "$PKG_DIR/gamefiles"
          mkdir -p "$PKG_DIR/licenses"
          mkdir -p "$PKG_DIR/licenses/innoextract"
          mkdir -p "$PKG_DIR/utils"
          mkdir -p "$PKG_DIR/ffmpeg.armhf"
          mkdir -p "$PKG_DIR/gl4es.armhf"
          #mkdir -p "$PKG_DIR/openal.armhf"
          mkdir -p "$PKG_DIR/steam"

          # Main ARMHF build output
          cp -a artifacts/noxd.armhf/. "$PKG_DIR/"

          # Normalize main binary name if needed
          if [ -f "$PKG_DIR/out" ]; then
            mv -f "$PKG_DIR/out" "$PKG_DIR/noxd.armhf"
          fi

          # Configs
          cp dist-scripts/nox.cfg.hires "$PKG_DIR/nox.cfg"
          cp dist-scripts/nox.gptk2.ini "$PKG_DIR/nox.gptk2.ini"

          # Starter script
          cp dist-scripts/startgen.sh "$PKG_DIR/Nox-Decomp.sh"
          chmod +x "$PKG_DIR/Nox-Decomp.sh"

          # Steam assets
          cp dist-scripts/steamv.png "$PKG_DIR/steam/steamv.png"
          cp dist-scripts/steamh.png "$PKG_DIR/steam/steamh.png"
          cp dist-scripts/io.github.sookyboo.nox-decomp.png \
            "$PKG_DIR/steam/io.github.sookyboo.nox-decomp.png"

          if [ -f dist-scripts/gamecontrollerdb.txt ]; then
            cp dist-scripts/gamecontrollerdb.txt "$PKG_DIR/steam/gamecontrollerdb.txt"
          fi

          if [ -f dist-scripts/steam_shortcut.py ]; then
            cp dist-scripts/steam_shortcut.py "$PKG_DIR/utils/steam_shortcut.py"
          fi

          # FFmpeg shared libs
          cp -a artifacts/ffmpeg.armhf/. "$PKG_DIR/ffmpeg.armhf/"
          
          # Remove pkgconfig and normalize ffmpeg .so names
          rm -rf "$PKG_DIR/ffmpeg.armhf/pkgconfig"

          find "$PKG_DIR/ffmpeg.armhf" -maxdepth 1 -type l -delete

          for f in "$PKG_DIR"/ffmpeg.armhf/*.so.*; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            short="$(printf '%s\n' "$base" | sed -E 's/^(.+\.so\.[0-9]+).*/\1/')"
            if [ "$base" != "$short" ]; then
              mv -f "$f" "$PKG_DIR/ffmpeg.armhf/$short"
            fi
          done

          # gl4es
          if [ -f artifacts/gl4es.armhf/libGL.so.1 ]; then
            cp artifacts/gl4es.armhf/libGL.so.1 "$PKG_DIR/gl4es.armhf/libGL.so.1"
          fi

          # OpenAL
          #if [ -f artifacts/noxd.armhf/libopenal.so.1 ]; then
          #  cp artifacts/noxd.armhf/libopenal.so.1 "$PKG_DIR/openal.armhf/libopenal.so.1"
          #elif [ -f "$PKG_DIR/libopenal.so.1" ]; then
          #  cp "$PKG_DIR/libopenal.so.1" "$PKG_DIR/openal.armhf/libopenal.so.1"
          #fi

          # Licenses
          cp dist-scripts/licenses/ffmpeg_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/gl4es_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/innoextract_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/libopenal_LICENCE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/nox_decomp_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/sdl_LICENSE.txt "$PKG_DIR/licenses/"

          # Optional extra innoextract license files if present in repo
          if [ -d dist-scripts/licenses/innoextract ]; then
            cp -a dist-scripts/licenses/innoextract/. "$PKG_DIR/licenses/innoextract/"
          fi

          # Innoextract binary
          if [ -f dist-scripts/innoextract/out/linux-aarch64/innoextract-linux-aarch64 ]; then
            cp dist-scripts/innoextract/out/linux-aarch64/innoextract-linux-aarch64 \
              "$PKG_DIR/utils/innoextract.aarch64"
            chmod +x "$PKG_DIR/utils/innoextract.aarch64"
          else
            find dist-scripts/innoextract/out/linux-aarch64 -maxdepth 1 -type f | head -n 1 | while read -r f; do
              cp "$f" "$PKG_DIR/utils/innoextract.aarch64"
              chmod +x "$PKG_DIR/utils/innoextract.aarch64"
            done
          fi

          # Keep empty gamefiles dir in tar
          touch "$PKG_DIR/gamefiles/.gitkeep"

      - name: Create Linux ARMHF release tarball
        run: |
          set -euxo pipefail
          tar -C artifacts/noxd.armhf.package -czf artifacts/nox-decomp-linux-armhf-${RELEASE_SUFFIX}.tar.gz .

      - name: Upload Linux ARMHF release tarball
        uses: actions/upload-artifact@v7
        with:
          name: noxd-linux-armhf-tarball
          path: artifacts/nox-decomp-linux-armhf-${{ env.RELEASE_SUFFIX }}.tar.gz
          archive: false

      - name: Assemble Flatpak beta package
        run: |
          set -euxo pipefail

          PKG_DIR="artifacts/flatpak-beta"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR"

          cp dist-scripts/flathub/io.github.sookyboo.nox-decomp.flatpak \
            "$PKG_DIR/io.github.sookyboo.nox-decomp.flatpak"
          cp dist-scripts/flathub/install.sh \
            "$PKG_DIR/install.sh"

      - name: Create Flatpak beta zip
        run: |
          set -euxo pipefail
          cd artifacts/flatpak-beta
          zip -r ../flatpak-${RELEASE_SUFFIX}.zip .

      - name: Upload Flatpak beta zip
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/flatpak-${{ env.RELEASE_SUFFIX }}.zip
          archive: false

      - name: Create source snapshot tarball
        run: |
          set -euxo pipefail

          rm -rf artifacts/source-snapshot
          rm -f nox-decomp-main.tar.gz
          mkdir -p artifacts/source-snapshot

          git archive --format=tar HEAD | tar -xf - -C artifacts/source-snapshot

          rm -f artifacts/source-snapshot/dist-scripts/steamh.png
          rm -f artifacts/source-snapshot/dist-scripts/steamv.png

          tar -C artifacts/source-snapshot -czf nox-decomp-main.tar.gz .

      - name: Assemble PortMaster package
        run: |
          set -euxo pipefail

          PKG_ROOT="artifacts/portmaster.package"
          PKG_DIR="$PKG_ROOT/nox-decomp"

          rm -rf "$PKG_ROOT"
          mkdir -p "$PKG_DIR"
          mkdir -p "$PKG_DIR/ffmpeg.armhf"
          mkdir -p "$PKG_DIR/ffmpeg.i386"
          mkdir -p "$PKG_DIR/gamefiles"
          mkdir -p "$PKG_DIR/gl4es.armhf"
          mkdir -p "$PKG_DIR/licenses"
          mkdir -p "$PKG_DIR/openal.armhf"
          mkdir -p "$PKG_DIR/src"

          # Top-level launcher script
          cp dist-scripts/portmasterstart.sh "$PKG_ROOT/Nox-Decomp.sh"
          chmod +x "$PKG_ROOT/Nox-Decomp.sh"

          # PortMaster metadata/assets
          cp dist-scripts/portmaster/cover.png "$PKG_DIR/cover.png"
          cp dist-scripts/portmaster/screenshot.png "$PKG_DIR/screenshot.png"
          cp dist-scripts/portmaster/gameinfo.xml "$PKG_DIR/gameinfo.xml"
          cp dist-scripts/portmaster/port.json "$PKG_DIR/port.json"
          cp dist-scripts/portmaster/README.md "$PKG_DIR/nox-decomp.md"

          # Main binaries
          if [ -f artifacts/noxd.armhf/out ]; then
            cp artifacts/noxd.armhf/out "$PKG_DIR/noxd.armhf"
          elif [ -f artifacts/noxd.armhf/noxd.armhf ]; then
            cp artifacts/noxd.armhf/noxd.armhf "$PKG_DIR/noxd.armhf"
          else
            cp artifacts/noxd.armhf/* "$PKG_DIR/" || true
            [ -f "$PKG_DIR/out" ] && mv "$PKG_DIR/out" "$PKG_DIR/noxd.armhf"
          fi

          if [ -f artifacts/noxd.i386/out ]; then
            cp artifacts/noxd.i386/out "$PKG_DIR/noxd.i386"
          elif [ -f artifacts/noxd.i386/noxd.i386 ]; then
            cp artifacts/noxd.i386/noxd.i386 "$PKG_DIR/noxd.i386"
          else
            cp artifacts/noxd.i386/* "$PKG_DIR/" || true
            [ -f "$PKG_DIR/out" ] && mv "$PKG_DIR/out" "$PKG_DIR/noxd.i386"
          fi

          # Configs
          cp dist-scripts/nox.cfg "$PKG_DIR/nox.cfg.default"
          cp dist-scripts/nox.cfg.hires "$PKG_DIR/nox.cfg.hires"
          cp dist-scripts/nox.gptk2.nintendo.ini "$PKG_DIR/nox.gptk2.ini"

          # FFmpeg shared libs
          cp -a artifacts/ffmpeg.armhf/. "$PKG_DIR/ffmpeg.armhf/"
          cp -a artifacts/ffmpeg.i386/. "$PKG_DIR/ffmpeg.i386/"

          # Remove pkgconfig and normalize ffmpeg .so names
          rm -rf "$PKG_DIR/ffmpeg.armhf/pkgconfig" "$PKG_DIR/ffmpeg.i386/pkgconfig"
          find "$PKG_DIR/ffmpeg.armhf" -maxdepth 1 -type l -delete
          find "$PKG_DIR/ffmpeg.i386" -maxdepth 1 -type l -delete

          for dir in "$PKG_DIR/ffmpeg.armhf" "$PKG_DIR/ffmpeg.i386"; do
            for f in "$dir"/*.so.*; do
              [ -e "$f" ] || continue
              base="$(basename "$f")"
              short="$(printf '%s\n' "$base" | sed -E 's/^(.+\.so\.[0-9]+).*/\1/')"
              if [ "$base" != "$short" ]; then
                mv -f "$f" "$dir/$short"
              fi
            done
          done

          # gl4es / openal
          cp artifacts/gl4es.armhf/libGL.so.1 "$PKG_DIR/gl4es.armhf/libGL.so.1"
          #if [ -f artifacts/noxd.armhf/libopenal.so.1 ]; then
          #  cp artifacts/noxd.armhf/libopenal.so.1 "$PKG_DIR/openal.armhf/libopenal.so.1"
          #fi
          #Download openal from PortMaster
          curl -fL \
            -o "$PKG_DIR/openal.armhf/libopenal.so.1" \
            https://raw.githubusercontent.com/PortsMaster/PortMaster-New/main/ports/nox-decomp/nox-decomp/openal.armhf/libopenal.so.1

          # Licenses
          cp dist-scripts/licenses/ffmpeg_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/gl4es_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/innoextract_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/libopenal_LICENCE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/nox_decomp_LICENSE.txt "$PKG_DIR/licenses/"
          cp dist-scripts/licenses/sdl_LICENSE.txt "$PKG_DIR/licenses/"

          # Empty gamefiles dir
          touch "$PKG_DIR/gamefiles/.gitkeep"

          # Source bundle / build files
          [ -f build.txt ] && cp build.txt "$PKG_DIR/src/build.txt"

          # Repo snapshot
          cp nox-decomp-main.tar.gz "$PKG_DIR/src/nox-decomp-main.tar.gz"

      - name: Create PortMaster zip
        run: |
          set -euxo pipefail
          cd artifacts/portmaster.package
          zip -r "../portmaster-${RELEASE_SUFFIX}.zip" .

      - name: Upload PortMaster zip
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/portmaster-${{ env.RELEASE_SUFFIX }}.zip
          archive: false

      - name: Create SHA256 sums
        run: |
          set -euxo pipefail

          cd artifacts
          sha256sum \
            "noxd.win32.x86-${RELEASE_SUFFIX}.zip" \
            "nox-decomp-linux-i386-${RELEASE_SUFFIX}.tar.gz" \
            "nox-decomp-linux-armhf-${RELEASE_SUFFIX}.tar.gz" \
            "flatpak-${RELEASE_SUFFIX}.zip" \
            "portmaster-${RELEASE_SUFFIX}.zip" \
            > "SHA256SUMS-${RELEASE_SUFFIX}.txt"

      - name: Upload SHA256 sums
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/SHA256SUMS-${{ env.RELEASE_SUFFIX }}.txt
          archive: false

      - name: Cleanup temporary build state
        if: always()
        run: |
          docker rm -f noxdecomp_tmp-x86 || true
          docker rm -f noxdecomp_tmp-winx86 || true
          docker rm -f noxdecomp_tmp-x86libs || true
          docker image prune -af || true
          docker builder prune -af || true

  publish-server:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set image tag
        run: |
          set -euxo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "IMAGE_TAG=main" >> "$GITHUB_ENV"
            echo "ALSO_TAG_LATEST=false" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "ALSO_TAG_LATEST=true" >> "$GITHUB_ENV"
          fi

      - name: Set release suffix
        run: |
          set -euxo pipefail
          RAW_NAME="${GITHUB_REF_NAME}"
          SAFE_NAME="$(printf '%s' "$RAW_NAME" | sed 's#[^A-Za-z0-9._-]#-#g')"
          echo "RELEASE_SUFFIX=${SAFE_NAME}" >> "$GITHUB_ENV"

      - name: Download Linux i386 release tarball
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: nox-decomp-linux-i386-*.tar.gz
          merge-multiple: true

      - name: Download Linux ARMHF release tarball
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: nox-decomp-linux-armhf-*.tar.gz
          merge-multiple: true

      - name: Stage server build inputs from release tarballs
        run: |
          set -euxo pipefail

          rm -rf extracted.i386 extracted.armhf
          rm -rf ffmpeg.i386 ffmpeg.armhf
          rm -f noxd.i386 noxd.armhf server.sh

          mkdir -p extracted.i386 extracted.armhf

          tar -C extracted.i386 -xzf "artifacts/nox-decomp-linux-i386-${RELEASE_SUFFIX}.tar.gz"
          tar -C extracted.armhf -xzf "artifacts/nox-decomp-linux-armhf-${RELEASE_SUFFIX}.tar.gz"

          cp -a extracted.i386/ffmpeg.i386 ./ffmpeg.i386
          cp -a extracted.armhf/ffmpeg.armhf ./ffmpeg.armhf
          cp extracted.i386/noxd.i386 ./noxd.i386
          cp extracted.armhf/noxd.armhf ./noxd.armhf

          cp dist-scripts/server.sh ./server.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

#      - name: Log in to GHCR
#        uses: docker/login-action@v4
#        with:
#          registry: ghcr.io
#          username: ${{ github.actor }}
#          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push amd64 server image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --progress=plain \
            --cache-from type=gha,scope=noxdecomp-server-amd64 \
            --cache-to type=gha,scope=noxdecomp-server-amd64,mode=max \
            -f dist-scripts/Dockerfile.x86 \
            -t ghcr.io/nox-decomp/nox-decomp-server:amd64-${IMAGE_TAG} \
            --push \
            .

      - name: Build and push arm64 server image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --progress=plain \
            --cache-from type=gha,scope=noxdecomp-server-arm64 \
            --cache-to type=gha,scope=noxdecomp-server-arm64,mode=max \
            -f dist-scripts/Dockerfile.armhf \
            -t ghcr.io/nox-decomp/nox-decomp-server:arm64-${IMAGE_TAG} \
            --push \
            .

      - name: Create multi-arch image tag
        run: |
          docker buildx imagetools create \
            -t ghcr.io/nox-decomp/nox-decomp-server:${IMAGE_TAG} \
            ghcr.io/nox-decomp/nox-decomp-server:amd64-${IMAGE_TAG} \
            ghcr.io/nox-decomp/nox-decomp-server:arm64-${IMAGE_TAG}

      - name: Create multi-arch latest tag
        if: env.ALSO_TAG_LATEST == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/nox-decomp/nox-decomp-server:latest \
            ghcr.io/nox-decomp/nox-decomp-server:amd64-${IMAGE_TAG} \
            ghcr.io/nox-decomp/nox-decomp-server:arm64-${IMAGE_TAG}

  release:
    runs-on: ubuntu-latest
    needs:
      - build
      - publish-server
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Show release files
        run: |
          find release-assets -type f | sort

      - name: Set release suffix
        run: |
          set -euxo pipefail
          RAW_NAME="${GITHUB_REF_NAME}"
          SAFE_NAME="$(printf '%s' "$RAW_NAME" | sed 's#[^A-Za-z0-9._-]#-#g')"
          echo "RELEASE_SUFFIX=${SAFE_NAME}" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<EOF
          Automated release for ${GITHUB_REF_NAME}

          [GamePad Button Mapping Guide](https://github.com/sookyboo/nox-decomp/blob/main/docs/gamepad.md)

          PortMaster stable build for linux handheld consoles is available [here](https://portmaster.games/detail.html?name=nox-decomp)

          [SteamDeck install instructions](https://github.com/sookyboo/nox-decomp?tab=readme-ov-file#steam-deck)
          [Linux install instructions](https://github.com/sookyboo/nox-decomp?tab=readme-ov-file#linux)
          [Windows install instructions](https://github.com/sookyboo/nox-decomp?tab=readme-ov-file#windows)
          [Mac install instructions via crossover](https://github.com/sookyboo/nox-decomp?tab=readme-ov-file#mac)

          [First time playing game tips](https://github.com/sookyboo/nox-decomp/blob/main/docs/gametips.md)

          Server versions:
          [docker-compose.yml](https://github.com/sookyboo/nox-decomp/blob/main/dist-scripts/docker-compose.yml)
          [kubernetes](https://github.com/sookyboo/nox-decomp/blob/main/dist-scripts/nox-decomp-kube.yml)

          [Multiplayer networking guide](https://github.com/sookyboo/nox-decomp/blob/main/docs/multiplayer.md)
          EOF

          gh release create "${GITHUB_REF_NAME}" \
            "release-assets/noxd.win32.x86-${RELEASE_SUFFIX}.zip" \
            "release-assets/nox-decomp-linux-i386-${RELEASE_SUFFIX}.tar.gz" \
            "release-assets/nox-decomp-linux-armhf-${RELEASE_SUFFIX}.tar.gz" \
            "release-assets/flatpak-${RELEASE_SUFFIX}.zip" \
            "release-assets/portmaster-${RELEASE_SUFFIX}.zip" \
            "release-assets/SHA256SUMS-${RELEASE_SUFFIX}.txt" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md